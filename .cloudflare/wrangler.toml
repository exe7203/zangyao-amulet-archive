name = "taijuda-amulet-archive"
main = "../dist/server/index.js"
compatibility_date = "2026-08-11"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../dist/client"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "taijuda-prod"
database_id = "91359451-badf-4ba1-a439-96b7780fc2b4"
migrations_dir = "../drizzle"


[triggers]
crons = ["* * * * *"]

[vars]
NEXT_PUBLIC_SITE_CODE = "taijuda"
STORE_ORDERS_ENABLED = "0"
ADMIN_LOCAL_AUTH_REQUIRED = "0"
ADMIN_EMAIL_ALLOWLIST = "exe7203@gmail.com"

[observability]
enabled = true
