name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".design-backup/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Write deploy config
        env:
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_SITE_URL: ${{ secrets.CF_SITE_URL }}
          CF_ADMIN_EMAIL: ${{ secrets.CF_ADMIN_EMAIL }}
        run: |
          mkdir -p .cloudflare
          cat > .cloudflare/deploy.json <<EOF
          {
            "databaseName": "taijuda-prod",
            "databaseId": "${CF_DATABASE_ID}",
            "accountSubdomain": "exe7203",
            "siteUrl": "${CF_SITE_URL}",
            "workerName": "taijuda-amulet-archive",
            "adminEmailAllowlist": "${CF_ADMIN_EMAIL}"
          }
          EOF

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run cf:setup-all
